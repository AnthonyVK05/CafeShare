<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeShare – Smarter Choices. Less Waste. Better Campus Dining.</title>
    <style>
:root {
  --bg:#f6f7fb; 
  --card:#ffffff; 
  --ink:#1c2333; 
  --muted:#6b7280; 
  --line:#e5e7eb;
  --brand:#ff7a1a; 
  --brand2:#ffb35c; 
  --green:#16a34a; 
  --amber:#d97706; 
  --red:#dc2626;
  --blue:#2563eb; 
  --purple:#7c3aed; 
  --shadow:0 2px 10px rgba(20,25,40,.08); 
  --r:14px;
}

[data-theme="dark"] {
  --bg:#12151d; 
  --card:#1c2130; 
  --ink:#eef1f7; 
  --muted:#9aa3b5; 
  --line:#2b3247;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
}

a {
  color:inherit;
  text-decoration:none;
}

button {
  font:inherit;
  cursor:pointer;
  border:none;
  border-radius:10px;
  padding:9px 16px;
  font-weight:600;
  transition:.15s;
}

.btn-brand {
  background:var(--brand);
  color:#fff;
}

.btn-brand:hover {
  background:#e66a0f;
}

.btn-ghost {
  background:transparent;
  border:1.5px solid var(--line);
  color:var(--ink);
}

.btn-ghost:hover {
  border-color:var(--brand);
  color:var(--brand);
}

.btn-sm {
  padding:5px 11px;
  font-size:.83rem;
  border-radius:8px;
}

.btn-green {
  background:var(--green);
  color:#fff;
}
  
.btn-red { 
  background:var(--red);
  color:#fff;
}

.btn-blue {
  background:var(--blue);
  color:#fff;
}

input, select, textarea {
  font:inherit;
  padding:9px 12px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--ink);
  width:100%;
}

input:focus,
select:focus,
textarea:focus {
  outline:none;
  border-color:var(--brand);
}

label {
  font-size:.82rem;
  font-weight:600;
  color:var(--muted);
  display:block;
  margin-bottom:4px;
}

.muted {
  color:var(--muted);
} 

.small { 
  font-size:.82rem;
}

h1 {
  font-size:1.5rem;
} 

h2 { 
  font-size:1.15rem;
} 

h3 { 
  font-size:1rem;
}

/* ---------- app shell / sidebar nav ---------- */
.logo {
  font-size:1.3rem;
  font-weight:800;
  color:var(--brand);
}

.logo span {
  color:var(--brand2);
}

.iconbtn {
  background:var(--card); 
  border:1.5px solid var(--line); 
  border-radius:50%;
  width:38px;
  height:38px;
  padding:0;
  display:grid;
  place-items:center;
  position:relative;
  font-size:1rem;
}

.badge {
  position:absolute;
  top:-4px;
  right:-4px;
  background:var(--red);
  color:#fff;
  font-size:.65rem;
  border-radius:50%;
  width:17px;
  height:17px;
  display:grid;
  place-items:center;
  font-weight:700;
}

.dot {
  width:9px;
  height:9px;
  border-radius:50%;
  display:inline-block;
  margin-right:5px;
}

.app-shell {
  display:flex;
  min-height:100vh;
}

.sidebar {
  width:222px;
  flex-shrink:0;
  background:var(--card);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:18px;
  padding:18px 14px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}

.sidebar .logo {
  padding:0 6px;
}

.sidenav {
  display:flex;
  flex-direction:column;
  gap:3px;
  flex:1;
}

.sidenav button {
  background:none;
  color:var(--muted);
  padding:10px 12px;
  border-radius:10px;
  font-weight:600;
  text-align:left;
  width:100%;
}

.sidenav button.active {
  background:#fff1e4;
  color:var(--brand);
}

[data-theme="dark"] .sidenav button.active {
  background:#3a2a18;
  color:#ffb35c;
}

.sidebar-bottom {
  display:flex;
  align-items:center;
  justify-content:space-evenly;
  gap:10px;
  margin-top:auto;
  padding:16px 4px 2px;
  border-top:1px solid var(--line);
}

.sidebar-bottom .iconbtn {
  width:42px;
  height:42px;
  flex:0 0 42px;
  padding:0;
  background:var(--bg);
  border:1px solid var(--line);
  font-size:1.05rem;
  color:var(--ink);
}

.sidebar-bottom .iconbtn:hover {
  border-color:var(--brand);
  color:var(--brand);
  transform:translateY(-1px);
}

.content {
  flex:1;
  min-width:0;
}

.mobile-topbar {
  display:none;
  position:sticky;
  top:0;
  z-index:60;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  background:var(--card);
  border-bottom:1px solid var(--line);
}

.hamburger {
  background:none;
  border:1.5px solid var(--line);
  border-radius:10px;
  width:40px;
  height:40px;
  font-size:1.1rem;
  display:grid;
  place-items:center;
}

.sidebar-overlay { 
  display:none;
}

/* ---------- layout ---------- */
.wrap {
  max-width:1180px;
  margin:0 auto;
  padding:18px;
}

.hero {
  background:linear-gradient(120deg,#ff7a1a,#ffb35c);
  border-radius:var(--r);
  padding:28px 24px;
  color:#fff;
  margin-bottom:20px;
}

.hero h1 {
  color:#fff;
  margin-bottom:6px;
}

.hero .searchrow {
  display:flex;
  gap:10px;
  margin-top:14px;
  max-width:560px;
}

.hero .searchrow input {
  background:#fff;
  border:none;
}

.section {
  margin-bottom:24px;
}

.sechead {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;
}

.card { 
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.foodimg {
    height: 110px;
    display: grid;
    place-items: center;
    font-size: 2.6rem;
    position: relative;
    overflow: hidden;
}

.avail {
  position:absolute;
  top:8px;
  left:8px;
  font-size:.7rem;
  font-weight:700;
  color:#fff;
  padding:3px 9px;
  border-radius:20px;
}

.cardbody {
  padding:12px 14px 14px;
  display:flex;
  flex-direction:column;
  gap:6px;
  flex:1;
}

.foodname {
  font-weight:700;
}

.rowline {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.price {
  font-weight:800;
  color:var(--brand);
}

.tags {
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.tag {
  font-size:.68rem;
  font-weight:700;
  padding:2px 8px;
  border-radius:20px;
  background:var(--bg);
  color:var(--muted);
  border:1px solid var(--line);
}

.pop {
  font-size:.75rem;
}

.fav {
  position:absolute;
  top:8px;
  right:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border-radius:50%;
  width:32px;
  height:32px;
  padding:0;
  font-size:1rem;
}

.chiprow {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.chip {
  padding:7px 15px;
  border-radius:20px;
  border:1.5px solid var(--line);
  background:var(--card);
  color:var(--ink);
  font-weight:600;
  font-size:.85rem;
}

.chip.on {
  background:var(--brand);
  border-color:var(--brand);
  color:#fff;
}

.panel {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:18px;
  box-shadow:var(--shadow);
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:.88rem;
}

th,td {
  padding:9px 10px;
  text-align:left;
  border-bottom:1px solid var(--line);
}

th {
  color:var(--muted);
  font-size:.75rem;
  text-transform:uppercase;
  letter-spacing:.4px;
}

tr:hover td {
  background:rgba(0,0,0,.02);
}

[data-theme="dark"] tr:hover td {
  background:rgba(255,255,255,.03);
}

.statuschip {
  padding:3px 10px;
  border-radius:20px;
  font-size:.75rem;
  font-weight:700;
  color:#fff;
}

.st-av {
  background:var(--green);
}

.st-li {
  background:var(--amber);
}

.st-so {
  background:var(--red);
}

/* bars */
.barchart {
  display:flex;
  align-items:flex-end;
  gap:8px;
  height:130px;
  padding:8px 4px 0;
  border-bottom:2px solid var(--line);
}

.bar {
  flex:1;
  background:linear-gradient(180deg,var(--brand),var(--brand2));
  border-radius:5px 5px 0 0;
  position:relative;
  min-width:14px;
}

.bar:hover::after {
  content:attr(data-v);
  position:absolute;
  top:-22px;
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--bg);
  font-size:.7rem;
  padding:2px 6px;
  border-radius:5px;
  white-space:nowrap;
}

.barlabel {
  font-size:.68rem;
  text-align:center;
  color:var(--muted);
  margin-top:5px;
}

/* forms / login */
.loginwrap {
  min-height:100vh;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ff7a1a,#ffb35c);
  padding:20px;
}

.loginbox {
  background:#fff;
  border-radius:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.2);
  padding:32px;
  width:100%;
  max-width:420px;
  color:#1c2333;
}

.loginbox .logo {
  font-size:1.8rem;
  text-align:center;
  display:block;
  margin-bottom:4px;
}

.field {
  margin-bottom:14px;
}

.rolepick {
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.rolepick button {
  flex:1;
  padding:10px;
  border:1.5px solid var(--line);
  background:#fff;
}

.rolepick button.on {
  border-color:var(--brand);
  background:#fff1e4;
  color:var(--brand);
}

.notifitem {
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:10px;
}

.notifitem.unread {
  background:rgba(255,122,26,.07);
}

.hbtn {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:12px;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:var(--card);
  flex:1;
  min-width:76px;
  font-weight:700;
}

.statrow {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin-bottom:18px;
}

.stat {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:16px;
}

.stat .num {
  font-size:1.6rem;
  font-weight:800;
  color:var(--brand);
}

.kpi {
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px dashed var(--line);
  font-size:.9rem;
}

.mealtotal {
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  font-weight:700;
}

.mealtotal.over {
  color:var(--red);
}

.empty {
  padding:40px;
  text-align:center;
  color:var(--muted);
}

.compare-slot {
  border:2px dashed var(--line);
  border-radius:var(--r);
  padding:16px;
  text-align:center;
  min-height:150px;
  display:grid;
  place-items:center;
}

.toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--bg);
  padding:11px 22px;
  border-radius:30px;
  font-weight:600;
  z-index:99;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  animation:fadein .25s;
}

@keyframes fadein {

  from {
    opacity:0;
    transform:translate(-50%,10px);
  }
  to {
    opacity:1;
    transform:translate(-50%,0);
  }

}

.detailwrap {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

@media (max-width:760px) {

  .app-shell {
    flex-direction:column;
  }

  .mobile-topbar {
    display:flex;
  }

  .sidebar {
    position:fixed;
    z-index:70;
    top:0;
    left:0;
    height:100vh;
    width:78vw;
    max-width:280px;
    transform:translateX(-100%);
    transition:transform .2s ease;
    box-shadow:0 0 0 rgba(0,0,0,0);
  }

  .sidebar.open { 
    transform:translateX(0);
    box-shadow:0 0 24px rgba(0,0,0,.25);
  }

  .sidebar {
    flex-direction:column;
    align-items:stretch;
    overflow-x:visible;
    overflow-y:auto;
  }

  .sidenav {
    flex-direction:column;
  }

  .sidebar-bottom {
    border-top:1px solid var(--line);
    border-left:none;
    padding:16px 4px 2px;
  }

  .sidebar-overlay.open {
    display:block;
    position:fixed;
    inset:0;
    z-index:65;
    background:rgba(0,0,0,.4);
  }

  .content {
    width:100%;
  }

  .detailwrap {
    grid-template-columns:1fr;
  }
  
  .hero .searchrow { 
    flex-direction:column;
  }

}

select.inline {
  width:auto;
}

.food-menu-image {
  width: 55px;
  height: 45px;
  object-fit: cover;
  border-radius: 6px;
  vertical-align: middle;
  margin-right: 8px;
}

#mf-image-preview {
  max-width: 100%;
  border: 1px solid var(--line);
}

.food-card-image {
  display: block;
  width: 100%;
  height: 110px;
  object-fit: contain;
}

.food-card-icon {
  display: flex;
  width: 100%;
  height: 110px;
  align-items: center;
  justify-content: center;
}

.foodimg .avail,
.foodimg .fav {
  position: absolute;
  z-index: 2;
}    </style>

  if(!name||!email.toLowerCase().endsWith("@cafeshare.my")||pass.length<6){toast("Please use a valid @cafeshare.my email and a password of at least 6 characters.");return;}
  if(registerRole==="vendor"){
    const stall=document.getElementById("rg-stall"),loc=document.getElementById("rg-location"),cuisine=document.getElementById("rg-cuisine");
    if(!stall||!stall.value.trim()||!loc||!loc.value.trim()||!cuisine||!cuisine.value.trim()){toast("Please enter your stall name, location and cuisine / food type.");return;}
  }
  if(DB.users.some(u=>u.email.toLowerCase()===email.toLowerCase())){toast("Email already registered.");return;}
  const uid=nid(DB.users,"user_id");
  DB.users.push({user_id:uid,name,email,password:pass,role:registerRole,created_at:new Date().toISOString().slice(0,10)});
  if(registerRole==="student"){
    DB.students.push({student_id:nid(DB.students,"student_id"),user_id:uid,preferences:"none",budget:10,status:"active"});

  }

  toast(registerRole==="vendor"?"Vendor account created! Wait for admin approval before logging in.":"Student account created! You can log in now.");

}

function bindExplore(){
  const q=document.getElementById("ex-q");q.addEventListener("input",()=>{exploreQ=q.value;drawResults();});
  const s=document.getElementById("ex-sort");s.value=sortBy;s.addEventListener("change",()=>{sortBy=s.value;drawResults();});
  const c=document.getElementById("ex-custom");c.addEventListener("input",()=>{filters.custom=c.value?parseFloat(c.value):null;drawResults();});
  document.querySelectorAll(".chiprow[data-g]").forEach(g=>g.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
    g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));ch.classList.add("on");
    filters[g.dataset.g]=ch.dataset.v;drawResults();
  }));
  document.querySelectorAll(`.chiprow[data-g] .chip[data-v="${filters.price}"]`).forEach(x=>x.classList.add("on"));
  drawResults();
}
function drawResults(){
  const q=(exploreQ||"").toLowerCase();
  let list=DB.foodItems.filter(f=>{
    if(DB.vendors.find(v=>v.vendor_id===f.vendor_id)?.is_open===false)return false;
    if(q&&!(f.name.toLowerCase().includes(q)||vName(f.vendor_id).toLowerCase().includes(q)||f.category.toLowerCase().includes(q)))return false;
    if(filters.price==="u5"&&f.price>=5)return false;
    if(filters.price==="510"&&(f.price<5||f.price>10))return false;
    if(filters.price==="1015"&&(f.price<10||f.price>15))return false;
    if(filters.custom&&f.price>filters.custom)return false;
    if(filters.diet&&!f.tags.includes(filters.diet))return false;
    if(filters.avail&&f.availability!==filters.avail)return false;
    if(filters.wait==="w5"&&f.wait>=5)return false;
    if(filters.wait==="w510"&&(f.wait<5||f.wait>10))return false;
    if(filters.wait==="w1020"&&(f.wait<10||f.wait>20))return false;
    if(filters.wait==="w20"&&f.wait<20)return false;
    return true;
  });
  if(sortBy==="plow")list.sort((a,b)=>a.price-b.price);
  else if(sortBy==="phigh")list.sort((a,b)=>b.price-a.price);
  else if(sortBy==="wait")list.sort((a,b)=>a.wait-b.wait);
  else list.sort((a,b)=>b.pop-a.pop);
  document.getElementById("ex-count").textContent=list.length+" item"+(list.length===1?"":"s")+" found";
  document.getElementById("ex-grid").innerHTML=list.map(f=>foodCard(f)).join("")||`<div class="empty panel" style="grid-column:1/-1">No food matches your filters. Try widening the search.</div>`;
  bindStudentActions(document.getElementById("ex-grid"));
}

function setBudget(){const v=parseFloat(document.getElementById("mb-budget").value);if(v>0){mealBudget=v;render();}}
function findMeal(){
  const mains=DB.foodItems.filter(f=>["Rice","Noodles","Chicken"].includes(f.category)&&f.stock_qty>0&&DB.vendors.find(v=>v.vendor_id===f.vendor_id)?.is_open!==false);
  const sides=DB.foodItems.filter(f=>["Drinks","Snacks","Desserts","Vegetarian"].includes(f.category)&&f.stock_qty>0&&DB.vendors.find(v=>v.vendor_id===f.vendor_id)?.is_open!==false);
  const cap=allowOver?mealBudget+2:mealBudget;
  for(let i=0;i<400;i++){
    const m=mains[Math.floor(Math.random()*mains.length)],s=sides[Math.floor(Math.random()*sides.length)];
    if(m.price+s.price<=cap){meal=[m.food_id,s.food_id];render();toast("Found a combo under "+fmt(cap)+"!");return;}
  }
  toast("Couldn't find a combo under "+fmt(cap)+". Try raising the budget.");
}
function placeOrder(total){
  const st=curStudent();const items=meal.map(id=>DB.foodItems.find(f=>f.food_id===id)).filter(Boolean);
  if(!items.length){toast("Add at least one item before placing an order.");return;}
  const qtyByFood={};items.forEach(f=>qtyByFood[f.food_id]=(qtyByFood[f.food_id]||0)+1);
  for(const [fid,qty] of Object.entries(qtyByFood)){
    const f=DB.foodItems.find(x=>x.food_id===+fid),v=f?DB.vendors.find(x=>x.vendor_id===f.vendor_id):null;
    if(!f||v?.is_open===false||f.stock_qty<qty){toast((f?f.name:"An item")+" no longer has enough stock. Please update your meal.");render();return;}
  }
  const vids=[...new Set(items.map(f=>f.vendor_id))];
  vids.forEach(vid=>{
    const vendorItems=items.filter(f=>f.vendor_id===vid),vendorTotal=vendorItems.reduce((sum,f)=>sum+Number(f.price||0),0),oid=nid(DB.orders,"order_id");
    DB.orders.push({order_id:oid,student_id:st.student_id,vendor_id:vid,total_amount:+vendorTotal.toFixed(2),status:"new",order_time:new Date().toLocaleString("en-MY",{hour12:false}),sale_recorded:false,stock_restored:false,rejection_reason:""});
    const grouped={};vendorItems.forEach(f=>{grouped[f.food_id]=(grouped[f.food_id]||0)+1;});
    Object.entries(grouped).forEach(([fid,qty])=>{const f=DB.foodItems.find(x=>x.food_id===+fid);DB.orderItems.push({order_item_id:nid(DB.orderItems,"order_item_id"),order_id:oid,food_id:f.food_id,quantity:qty,price:f.price});});
    const vendor=DB.vendors.find(v=>v.vendor_id===vid),vu=vendor?DB.users.find(u=>u.user_id===vendor.user_id):null;
    if(vu)notify(vu.user_id,"New order awaiting acceptance",curUser().name+" placed order #"+oid+" ("+fmt(vendorTotal)+").");
  });
  Object.entries(qtyByFood).forEach(([fid,qty])=>{const f=DB.foodItems.find(x=>x.food_id===+fid),wasOut=f.stock_qty<=0;f.stock_qty=Math.max(0,f.stock_qty-qty);syncStockAvailability(f);if(f.stock_qty<=0&&!wasOut&&typeof notifyFavouriteWatchers==="function")notifyFavouriteWatchers(f,"Sold out 😢",f.name+" at "+vName(f.vendor_id)+" just sold out.");});
  notify(curUser().user_id,"Order placed 🎉","Your order was sent to the vendor and is waiting for acceptance.");
  meal=[];saveDB();toast("Order placed! The vendor will accept it shortly.");view="profile";render();
}

function toggleVendorOpen(){const v=myVendor();v.is_open=!vendorOpen();saveDB();render();toast(v.is_open?"Stall is now open":"Stall is now closed");}

function setAvail(fid,st){
  const f=DB.foodItems.find(x=>x.food_id===fid&&x.vendor_id===myVendor().vendor_id);if(!f)return;const wasOut=f.stock_qty<=0;
  if(st==="soldout")f.stock_qty=0;else if(st==="limited")f.stock_qty=Math.min(Math.max(f.stock_qty||0,1),5);else f.stock_qty=Math.max(f.stock_qty||0,10);
  syncStockAvailability(f);
  if(f.stock_qty<=0&&!wasOut)notifyFavouriteWatchers(f,"Sold out 😢",f.name+" at "+vName(f.vendor_id)+" just sold out.");
  if(f.stock_qty>0&&wasOut)notifyFavouriteWatchers(f,"Favourite back in stock! ✅",f.name+" at "+vName(f.vendor_id)+" is available again.");
  saveDB();render();toast(f.name+" → "+availMeta(f.availability)[0]+" ("+f.stock_qty+" left)");
}
function updateStock(fid){const f=DB.foodItems.find(x=>x.food_id===fid&&x.vendor_id===myVendor().vendor_id),el=document.getElementById("vm-stock-"+fid);if(!f||!el)return;const wasOut=f.stock_qty<=0;f.stock_qty=Math.max(0,parseInt(el.value)||0);syncStockAvailability(f);if(f.stock_qty<=0&&!wasOut)notifyFavouriteWatchers(f,"Sold out 😢",f.name+" at "+vName(f.vendor_id)+" just sold out.");if(f.stock_qty>0&&wasOut)notifyFavouriteWatchers(f,"Favourite back in stock! ✅",f.name+" at "+vName(f.vendor_id)+" is available again.");saveDB();render();toast(f.name+" stock updated to "+f.stock_qty);}
function adjustStock(fid,delta){const f=DB.foodItems.find(x=>x.food_id===fid&&x.vendor_id===myVendor().vendor_id);if(!f)return;const wasOut=f.stock_qty<=0;f.stock_qty=Math.max(0,(f.stock_qty||0)+delta);syncStockAvailability(f);if(f.stock_qty<=0&&!wasOut)notifyFavouriteWatchers(f,"Sold out 😢",f.name+" at "+vName(f.vendor_id)+" just sold out.");if(f.stock_qty>0&&wasOut)notifyFavouriteWatchers(f,"Favourite back in stock! ✅",f.name+" at "+vName(f.vendor_id)+" is available again.");saveDB();render();toast(f.name+" stock: "+f.stock_qty);}

function setWait(w){myVendor().wait=w;DB.foodItems.filter(f=>f.vendor_id===myVendor().vendor_id).forEach(f=>{if(!f.wait||f.wait<1)f.wait=w;});saveDB();render();notifyStudents("Wait time update",myVendor().stall_name+" wait is now ~"+w+" min.");toast("Waiting time set to "+w+" min");}
function notifyStudents(title,msg){DB.students.forEach(s=>notify(s.user_id,title,msg));saveDB();}
function postAnn(){const t=document.getElementById("v-ann").value.trim();if(!t){toast("Write a message first.");return;}notifyStudents("📢 "+myVendor().stall_name,t);render();toast("Announcement sent to all students");}

function vOrderRow(o,compact=false){
  const s=DB.students.find(x=>x.student_id===o.student_id),u=s?DB.users.find(x=>x.user_id===s.user_id):null;
  const items=DB.orderItems.filter(i=>i.order_id===o.order_id).map(i=>{const f=DB.foodItems.find(x=>x.food_id===i.food_id);return f?`${f.icon} ${f.name} ×${i.quantity}`:"Unknown item";}).join(", ");
  let action="";
  if(o.status==="new")action=`<button class="btn-green btn-sm" onclick="orderStatus(${o.order_id},'accepted')">Accept</button> <button class="btn-red btn-sm" onclick="rejectOrder(${o.order_id})">Reject</button>`;
  else if(o.status==="accepted")action=`<button class="btn-blue btn-sm" onclick="orderStatus(${o.order_id},'preparing')">Start preparing</button> <button class="btn-red btn-sm" onclick="rejectOrder(${o.order_id})">Reject</button>`;
  else if(o.status==="preparing")action=`<button class="btn-blue btn-sm" onclick="orderStatus(${o.order_id},'ready')">Mark ready 🔔</button>`;
  else if(o.status==="ready")action=`${orderBadge(o.status)}<br><button class="btn-green btn-sm" style="margin-top:6px" onclick="orderStatus(${o.order_id},'collected')">Mark collected</button>`;
  else action=orderBadge(o.status);

function vordersHTML(){
  const list=[...vendorOrders()].sort((a,b)=>b.order_id-a.order_id),fresh=list.filter(o=>o.status==="new"),accepted=list.filter(o=>o.status==="accepted"),preparing=list.filter(o=>o.status==="preparing"),ready=list.filter(o=>o.status==="ready"),done=list.filter(o=>["collected","rejected","cancelled"].includes(o.status));
  return `<h2 style="margin-bottom:4px">🧾 Order Management</h2><p class="muted small" style="margin-bottom:12px">Orders now move through New → Accepted → Preparing → Ready → Collected. Reject an order before preparation if it cannot be fulfilled.</p>
  <div class="statrow"><div class="stat"><div class="num">${fresh.length}</div><div class="muted small">New</div></div><div class="stat"><div class="num">${accepted.length}</div><div class="muted small">Accepted</div></div><div class="stat"><div class="num">${preparing.length}</div><div class="muted small">Preparing</div></div><div class="stat"><div class="num">${ready.length}</div><div class="muted small">Ready</div></div></div>

function orderStatus(oid,st){
  const o=DB.orders.find(x=>x.order_id===oid&&x.vendor_id===myVendor().vendor_id);if(!o)return;
  const allowed={new:["accepted","rejected"],accepted:["preparing","rejected"],preparing:["ready"],ready:["collected"]};
  if(!(allowed[o.status]||[]).includes(st)){toast("That order cannot move to this status.");return;}
  o.status=st;const student=DB.students.find(x=>x.student_id===o.student_id);
  const messages={accepted:["Order accepted ✅","Your order #"+o.order_id+" from "+vName(o.vendor_id)+" was accepted."],preparing:["Order is being prepared 👨‍🍳","Your order #"+o.order_id+" is now being prepared."],ready:["Order ready! 🔔","Your order #"+o.order_id+" from "+vName(o.vendor_id)+" is ready for collection."],collected:["Order collected ✅","Order #"+o.order_id+" has been marked collected."]};
  if(st==="collected")recordOrderSale(o);
  if(student&&messages[st])notify(student.user_id,messages[st][0],messages[st][1]);
  saveDB();render();toast("Order #"+o.order_id+" → "+orderStatusMeta(st)[0]);
}
function rejectOrder(oid){
  const o=DB.orders.find(x=>x.order_id===oid&&x.vendor_id===myVendor().vendor_id);if(!o||!["new","accepted"].includes(o.status))return;
  const reason=prompt("Reason for rejecting this order:","Item unavailable");if(reason===null)return;
  o.status="rejected";o.rejection_reason=reason.trim()||"Unable to fulfil this order";restoreOrderStock(o);
  const st=DB.students.find(x=>x.student_id===o.student_id);if(st)notify(st.user_id,"Order rejected","Order #"+o.order_id+" from "+vName(o.vendor_id)+" was rejected. Reason: "+o.rejection_reason);
  saveDB();render();toast("Order rejected and reserved stock restored");
}

  <div class="panel"><h3>⏰ Peak order period</h3><div class="kpi"><span><strong>${peakLabel}</strong><br><span class="muted small">Calculated from this vendor's recorded orders</span></span><span>${peakEntry?peakEntry[1]+" order"+(peakEntry[1]==1?"":"s"):"—"}</span></div><h3 style="margin-top:16px">📦 Stock attention</h3>${stockRisk.length?stockRisk.slice(0,5).map(f=>`<div class="kpi"><span>${f.icon} ${f.name}</span><strong style="color:${f.stock_qty<=0?'var(--red)':'var(--amber)'}">${f.stock_qty||0} left</strong></div>`).join(""):`<p class="small muted" style="margin-top:6px">No items are currently low on stock.</p>`}<h3 style="margin-top:16px">📌 Next step</h3><p class="small muted" style="margin-top:6px">Keep stock quantities and order statuses updated. The insight becomes more useful as CafeShare records more real orders.</p></div></div>`;

  const v=myVendor(),reviews=DB.ratings.filter(r=>r.vendor_id===v.vendor_id),avg=reviews.length?reviews.reduce((s,r)=>s+r.rating,0)/reviews.length:0;
  return `<h2 style="margin-bottom:4px">⭐ Customer Reviews</h2><p class="muted small" style="margin-bottom:12px">See student feedback and respond when needed.</p>
  <div class="statrow"><div class="stat"><div class="num">${reviews.length?avg.toFixed(1):"—"}/5</div><div class="muted small">Average rating</div></div><div class="stat"><div class="num">${reviews.length}</div><div class="muted small">Reviews</div></div></div>
  <div class="panel">${reviews.length?reviews.map(r=>{const s=DB.students.find(x=>x.student_id===r.student_id),u=s?DB.users.find(x=>x.user_id===s.user_id):null,f=DB.foodItems.find(x=>x.food_id===r.food_id);return `<div style="padding:14px 0;border-bottom:1px solid var(--line)"><div class="sechead"><span><strong>${u?u.name:"Student"}</strong> · ⭐ ${r.rating}/5</span><span class="muted small">${f?f.name:"Food item"}</span></div><p class="small">${r.comment||"No written comment."}</p><div style="display:flex;gap:8px;margin-top:8px"><input id="reply-${r.rating_id}" placeholder="Reply to this review…" value="${r.reply||""}"><button class="btn-ghost btn-sm" onclick="saveReviewReply(${r.rating_id})">${r.reply?"Update":"Reply"}</button></div>${r.reply?`<p class="muted small" style="margin-top:6px">Your reply: ${r.reply}</p>`:""}</div>`;}).join(""):`<div class="empty">No reviews yet. Student feedback will appear here.</div>`}</div>`;
}
function saveReviewReply(rid){const r=DB.ratings.find(x=>x.rating_id===rid&&x.vendor_id===myVendor().vendor_id),input=document.getElementById("reply-"+rid);if(!r||!input)return;r.reply=input.value.trim();saveDB();render();toast(r.reply?"Reply saved":"Reply removed");}

/*
 * CafeShare - Admin module
 * Split from the original single-file prototype for maintainability.
 * Behaviour is intentionally preserved unless noted in the existing code.
 */

/* ==================== ADMIN ==================== */
let aview="adash";
function adminTabs(){return [{v:"adash",l:"Dashboard"},{v:"astudents",l:"Students"},{v:"avendors",l:"Vendors"},{v:"afood",l:"Categories"},{v:"aactivity",l:"Analytics"},{v:"aann",l:"Announcements"}];}
function renderAdmin(app){
  app.innerHTML=topbarHTML(adminTabs(),aview);
  const m=document.getElementById("main");
  if(aview==="adash")m.innerHTML=adashHTML();
  else if(aview==="astudents"){m.innerHTML=astudentsHTML();drawAdminStudents();}
  else if(aview==="avendors")m.innerHTML=avendorsHTML();
  else if(aview==="afood")m.innerHTML=afoodHTML();
  else if(aview==="aactivity")m.innerHTML=aactivityHTML();
  else if(aview==="aann")m.innerHTML=aannHTML();
  else if(aview==="notifs")m.innerHTML=notifsHTML();
}
function ago(v){aview=v;render();}
function adashHTML(){
  const pending=DB.vendors.filter(v=>v.status==="pending").length;
  return `<h2 style="margin-bottom:12px">🛡️ Admin Dashboard</h2>
  <div class="statrow">
    <div class="stat"><div class="num">${DB.users.filter(u=>u.role==="student").length}</div><div class="muted small">Students</div></div>
    <div class="stat"><div class="num">${DB.vendors.length}</div><div class="muted small">Vendors (${pending} pending)</div></div>
    <div class="stat"><div class="num">${DB.foodItems.length}</div><div class="muted small">Food items</div></div>
    <div class="stat"><div class="num">${DB.orders.length}</div><div class="muted small">Total orders</div></div>
    <div class="stat"><div class="num">${DB.orders.filter(o=>o.status==="collected"||o.sale_recorded).reduce((s,o)=>s+o.total_amount,0).toFixed(2)}</div><div class="muted small">Collected revenue (RM)</div></div>
  </div>
  ${pending?`<div class="panel" style="border-left:4px solid var(--amber);margin-bottom:16px"><h3>⏳ Vendors awaiting approval</h3>
  ${DB.vendors.filter(v=>v.status==="pending").map(v=>{const u=DB.users.find(u=>u.user_id===v.user_id);return `<div class="kpi"><span><strong>${v.stall_name}</strong><br><span class="muted small">${u?u.name+" · ":""}${v.location} · ${v.cuisine||"Cuisine not set"}</span></span><span><button class="btn-green btn-sm" onclick="approveVendor(${v.vendor_id})">Approve</button> <button class="btn-ghost btn-sm" onclick="ago('avendors')">Details</button></span></div>`;}).join("")}</div>`:""}
  <div class="panel"><h3>Latest activity</h3>
  ${DB.orders.slice(-5).reverse().map(o=>`<div class="kpi"><span>Order #${o.order_id} · ${vName(o.vendor_id)}</span><span>${fmt(o.total_amount)} · ${orderBadge(o.status)}</span></div>`).join("")}
  ${DB.ratings.map(r=>{const u=DB.users.find(u=>u.user_id===DB.students.find(s=>s.student_id===r.student_id)?.user_id);const f=DB.foodItems.find(f=>f.food_id===r.food_id);
  return `<div class="kpi"><span>⭐ ${r.rating}/5 by ${u?u.name:"student"}${f?" on "+f.name:""}</span><span class="muted small">“${r.comment}”</span></div>`;}).join("")}</div>`;
}
function approveVendor(vid){const v=DB.vendors.find(x=>x.vendor_id===vid);if(!v)return;v.status="approved";v.rejection_reason="";v.is_open=true;if(v.user_id)notify(v.user_id,"Stall approved ✅","Your stall "+v.stall_name+" is now approved. You can log in and open/close the stall from your dashboard.");saveDB();render();toast(v.stall_name+" approved");}
function rejectVendor(vid){const v=DB.vendors.find(x=>x.vendor_id===vid);if(!v)return;const reason=prompt("Reason for rejecting this vendor application:","Please provide more stall information");if(reason===null)return;v.status="rejected";v.rejection_reason=reason.trim()||"Application requirements were not met";v.is_open=false;if(v.user_id)notify(v.user_id,"Vendor application rejected",v.stall_name+" was not approved. Reason: "+v.rejection_reason);saveDB();render();toast(v.stall_name+" rejected");}
function toggleVendorActivation(vid){const v=DB.vendors.find(x=>x.vendor_id===vid);if(!v)return;v.status=v.status==="approved"?"deactivated":"approved";v.is_open=v.status==="approved";if(v.user_id)notify(v.user_id,v.status==="approved"?"Vendor account reactivated":"Vendor account deactivated",v.status==="approved"?"Your CafeShare vendor account is active again.":"Your CafeShare vendor account was deactivated by the administrator.");saveDB();render();}
function astudentsHTML(){
  return `<h2 style="margin-bottom:4px">🎓 Manage Students</h2><p class="muted small" style="margin-bottom:12px">Suspend an account without deleting its profile or order history. Suspended students cannot log in until reactivated.</p>
  <div class="panel" style="margin-bottom:12px"><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="as-search" placeholder="Search name or email…" style="flex:1;min-width:200px" oninput="drawAdminStudents()"><select id="as-status" style="width:auto" onchange="drawAdminStudents()"><option value="">All statuses</option><option value="active">Active</option><option value="suspended">Suspended</option></select></div></div>
  <div class="panel" style="padding:0;overflow:hidden"><div id="as-table" style="overflow-x:auto"></div></div>`;
}
function drawAdminStudents(){
  const box=document.getElementById("as-table");if(!box)return;const q=(document.getElementById("as-search")?.value||"").toLowerCase(),status=document.getElementById("as-status")?.value||"";
  const list=DB.students.filter(st=>{const u=DB.users.find(x=>x.user_id===st.user_id);return u&&(!q||(u.name+" "+u.email).toLowerCase().includes(q))&&(!status||st.status===status);});
  box.innerHTML=`<table><tr><th>Name</th><th>Email</th><th>Joined</th><th>Preference</th><th>Orders</th><th>Status</th><th></th></tr>${list.map(st=>{const u=DB.users.find(x=>x.user_id===st.user_id),oc=DB.orders.filter(o=>o.student_id===st.student_id).length;return `<tr><td><strong>${u.name}</strong></td><td class="muted">${u.email}</td><td>${u.created_at||"—"}</td><td>${st.preferences}</td><td>${oc}</td><td><span class="statuschip ${st.status==="suspended"?"st-so":"st-av"}">${st.status}</span></td><td><button class="${st.status==="suspended"?"btn-green":"btn-red"} btn-sm" onclick="toggleStudentStatus(${st.student_id})">${st.status==="suspended"?"Reactivate":"Suspend"}</button></td></tr>`;}).join("")||`<tr><td colspan="7" class="empty">No students match the current filter.</td></tr>`}</table>`;
}
function toggleStudentStatus(sid){const st=DB.students.find(s=>s.student_id===sid);if(!st)return;st.status=st.status==="suspended"?"active":"suspended";if(st.user_id)notify(st.user_id,st.status==="suspended"?"Account suspended":"Account reactivated",st.status==="suspended"?"Your CafeShare student account has been suspended. Contact the administrator if you need help.":"Your CafeShare student account is active again.");saveDB();drawAdminStudents();toast("Student account "+st.status);}
function avendorsHTML(){
  const order={pending:0,rejected:1,approved:2,deactivated:3};const list=[...DB.vendors].sort((a,b)=>(order[a.status]??9)-(order[b.status]??9));
  return `<h2 style="margin-bottom:4px">🍳 Manage Vendors</h2><p class="muted small" style="margin-bottom:12px">Review vendor registration details before approval and keep rejected/deactivated records instead of deleting them.</p>
  <div class="detailwrap">${list.map(v=>{const u=DB.users.find(x=>x.user_id===v.user_id),items=DB.foodItems.filter(f=>f.vendor_id===v.vendor_id).length,statusClass=v.status==="approved"?"st-av":v.status==="pending"?"st-li":"st-so";return `<div class="panel"><div class="sechead"><div><h3>${v.stall_name}</h3><span class="statuschip ${statusClass}">${v.status}</span></div><strong>${items} item${items===1?"":"s"}</strong></div><div class="kpi"><span>Owner</span><strong>${u?u.name:"Demo / system stall"}</strong></div><div class="kpi"><span>Email</span><span>${u?u.email:"—"}</span></div><div class="kpi"><span>Location</span><span>${v.location||"—"}</span></div><div class="kpi"><span>Cuisine / type</span><span>${v.cuisine||"—"}</span></div><div class="kpi"><span>Contact</span><span>${v.contact||"—"}</span></div><div class="kpi"><span>Wait time</span><span>${v.wait||0} min</span></div>${v.description?`<p class="small" style="margin-top:10px">${v.description}</p>`:""}${v.status==="rejected"&&v.rejection_reason?`<p class="small" style="color:var(--red);margin-top:8px"><strong>Rejection reason:</strong> ${v.rejection_reason}</p>`:""}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${v.status==="pending"?`<button class="btn-green btn-sm" onclick="approveVendor(${v.vendor_id})">Approve</button><button class="btn-red btn-sm" onclick="rejectVendor(${v.vendor_id})">Reject</button>`:v.status==="rejected"?`<button class="btn-green btn-sm" onclick="approveVendor(${v.vendor_id})">Approve after review</button>`:`<button class="${v.status==="approved"?"btn-red":"btn-green"} btn-sm" onclick="toggleVendorActivation(${v.vendor_id})">${v.status==="approved"?"Deactivate":"Reactivate"}</button>`}</div></div>`;}).join("")}</div>`;
}
function afoodHTML(){
  const counts={};getCategories().forEach(c=>counts[c]=DB.foodItems.filter(f=>f.category===c).length);
  return `<h2 style="margin-bottom:4px">🍽️ Manage Categories</h2><p class="muted small" style="margin-bottom:12px">Categories created here are immediately used by Student browsing and Vendor menu forms.</p><div class="detailwrap">
  <div class="panel"><h3>Category management</h3><div style="display:flex;gap:8px;margin:10px 0 14px"><input id="ac-new" placeholder="New category name"><button class="btn-brand" onclick="addCategory()">Add</button></div>${getCategories().map(c=>`<div class="kpi"><span>${categoryIcon(c)} <strong>${c}</strong> <span class="muted small">· ${counts[c]||0} item${counts[c]===1?"":"s"}</span></span><span><button class="btn-ghost btn-sm" onclick="renameCategory('${c.replace(/'/g,"\'")}')">Rename</button> <button class="btn-red btn-sm" onclick="deleteCategory('${c.replace(/'/g,"\'")}')">Delete</button></span></div>`).join("")}</div>
  <div class="panel"><h3>Items per category</h3><div style="margin-top:12px">${barChart(counts)}</div></div></div>
  <div class="panel" style="margin-top:16px;overflow-x:auto"><h3 style="margin-bottom:8px">All food items</h3><table><tr><th>Item</th><th>Vendor</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th></tr>${DB.foodItems.map(f=>`<tr><td>${f.icon} ${f.name}</td><td class="muted">${vName(f.vendor_id)}</td><td>${f.category}</td><td>${fmt(f.price)}</td><td>${f.stock_qty||0}</td><td><span class="statuschip ${availMeta(f.availability)[1]}">${availMeta(f.availability)[0]}</span></td></tr>`).join("")}</table></div>`;
}
function addCategory(){const el=document.getElementById("ac-new"),name=(el?.value||"").trim();if(!name){toast("Enter a category name first.");return;}if(getCategories().some(c=>c.toLowerCase()===name.toLowerCase())){toast("That category already exists.");return;}DB.categories.push(name);saveDB();render();toast(name+" category added");}
function renameCategory(oldName){const name=prompt("Rename category:",oldName);if(name===null)return;const clean=name.trim();if(!clean||clean===oldName)return;if(getCategories().some(c=>c.toLowerCase()===clean.toLowerCase())){toast("That category already exists.");return;}const i=DB.categories.indexOf(oldName);if(i>=0)DB.categories[i]=clean;DB.foodItems.filter(f=>f.category===oldName).forEach(f=>f.category=clean);saveDB();render();toast(oldName+" renamed to "+clean);}
function deleteCategory(name){const used=DB.foodItems.filter(f=>f.category===name).length;if(used){toast("Cannot delete "+name+" because "+used+" food item"+(used===1?" uses":"s use")+" it. Rename or move those items first.");return;}if(!confirm("Delete the "+name+" category?"))return;DB.categories=DB.categories.filter(c=>c!==name);saveDB();render();toast(name+" category deleted");}

function aactivityHTML(){
  const byHour={};Object.entries(DB.hourlyDemand).forEach(([h,n])=>byHour[h+":00"]=n);
  return `<h2 style="margin-bottom:12px">📈 Platform Analytics</h2>
  <div class="statrow">
    <div class="stat"><div class="num">${DB.orders.reduce((s,o)=>s+o.total_amount,0).toFixed(2)}</div><div class="muted small">GMV (RM)</div></div>
    <div class="stat"><div class="num">${(DB.orders.reduce((s,o)=>s+o.total_amount,0)/Math.max(DB.orders.length,1)).toFixed(2)}</div><div class="muted small">Avg order (RM)</div></div>
    <div class="stat"><div class="num">${DB.foodItems.filter(f=>f.availability==="soldout").length}</div><div class="muted small">Sold out now</div></div>
    <div class="stat"><div class="num">${DB.notifications.length}</div><div class="muted small">Notifications sent</div></div>
  </div>
  <div class="detailwrap">
    <div class="panel"><h3>Campus demand by hour</h3><div style="margin-top:10px">${barChart(byHour)}</div></div>
    <div class="panel"><h3>🗑 Food waste estimate</h3>
      <p class="small" style="margin-top:8px">Real-time availability updates have helped vendors cut estimated over-preparation by <strong style="color:var(--green)">~22%</strong> this month.</p>
      <div class="kpi"><span>Estimated portions saved from waste</span><strong>≈ 85</strong></div>
      <div class="kpi"><span>Most-wasted category (historical)</span><strong>Rice</strong></div>
      <div class="kpi"><span>Vendors using prep insights</span><strong>${DB.vendors.filter(v=>v.status==="approved").length} / ${DB.vendors.length}</strong></div>
      <p class="muted small" style="margin-top:8px">ℹ️ Estimates derived from sales vs. availability data. Not audited figures.</p></div>
  </div>`;
}
function aannHTML(){
  return `<h2 style="margin-bottom:12px">📣 Announcements</h2>
  <div class="panel" style="max-width:560px;margin-bottom:16px">
    <div style="display:flex;gap:8px"><input id="aa-text" placeholder="e.g. Cafeteria closed this Sunday for cleaning"><button class="btn-brand" onclick="postAdminAnn()">Broadcast</button></div>
  </div>
  <div class="panel">${DB.announcements.map((a,i)=>`<div class="kpi"><span>${a}</span><button class="btn-red btn-sm" onclick="DB.announcements.splice(${i},1);saveDB();render()">✕</button></div>`).join("")||`<p class="muted small">No announcements.</p>`}</div>`;
}
function postAdminAnn(){const t=document.getElementById("aa-text").value.trim();if(!t){toast("Write a message first.");return;}DB.announcements.unshift(t);DB.users.forEach(u=>notify(u.user_id,"📢 Campus announcement",t));saveDB();render();toast("Broadcast sent to all users");}

    /*
 * CafeShare - Application startup
 * Split from the original single-file prototype for maintainability.
 * Behaviour is intentionally preserved unless noted in the existing code.
 */
    render();

/* ==================== BOOT ==================== */
</script>
</body>
</html>
